# Publishes the website to GitHub Pages every time a change is saved.
# You don't need to edit this file.
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the site files
        uses: actions/checkout@v4

      - name: Install photo tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick libheif-examples libheif-plugin-libde265

      - name: Shrink photos and convert iPhone photos
        run: bash tools/prepare-photos.sh photos

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Build the site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Package the site
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
